[versions]
# Build tooling. Keep agp and kotlin aligned with the versions verified in the
# Android Gradle plugin compatibility table.
agp = "9.4.0"
kotlin = "2.3.21"

# AndroidX / Compose. Compose artifacts are versioned by the BOM.
#
# These are the newest releases whose AAR metadata still permits compileSdk 36. The next
# releases of core, lifecycle, navigation and the Compose BOM declare minCompileSdk 37, and
# platform 37 is only published on the SDK canary channel, so adopting them would mean
# building against a preview platform. Raise these pins together with compileSdk once
# platform 37 reaches the stable channel.
composeBom = "2026.06.01"
androidxCore = "1.18.0"
androidxActivity = "1.13.0"
androidxLifecycle = "2.10.0"
androidxNavigation = "2.9.8"
kotlinxCoroutines = "1.11.0"

# Media3. 1.11.1 is the newest stable release whose AAR metadata permits compileSdk 36.
media3 = "1.11.1"

# Testing.
junit = "4.13.2"
kotlinxCoroutinesTest = "1.11.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidxCore" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidxActivity" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "androidxNavigation" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }

androidx-media3-common = { group = "androidx.media3", name = "media3-common", version.ref = "media3" }
androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
androidx-media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }
androidx-media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }

# The effects module, and the only graphics dependency in the project. ExoPlayerImpl.setVideoEffects
# refuses to run without it (it looks up androidx.media3.effect.SingleInputVideoGraph$Factory and
# throws otherwise), so the effect-pipeline measurement baseline cannot exist without it. Verified:
# its AAR metadata declares minCompileSdk 36, and its own dependency graph adds only media3-common,
# media3-datasource, kotlin-stdlib, annotation, concurrent-futures and kotlinx-coroutines-guava.
androidx-media3-effect = { group = "androidx.media3", name = "media3-effect", version.ref = "media3" }

androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutinesTest" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
