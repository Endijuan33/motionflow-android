name: Android Build

# MotionFlow is built on GitHub Actions. Every push and pull request runs the full
# quality gate: lint, unit tests and a debug APK that is published as an artifact.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Least privilege: the workflow only reads the repository.
permissions:
  contents: read

# A newer commit on the same ref supersedes an in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Android SDK packages the build needs. compileSdk 36 is the latest stable platform and
  # 36.0.0 is the build-tools default for AGP 9.4.
  ANDROID_PLATFORM: platforms;android-36
  ANDROID_BUILD_TOOLS: build-tools;36.0.0

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools ${{ env.ANDROID_PLATFORM }} ${{ env.ANDROID_BUILD_TOOLS }}'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Gradle User Home caching, keyed on the wrapper and version catalog.
          cache-read-only: false

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      # Record what was built, so an artifact can be traced back to the commit that produced it
      # without downloading it first. The digest also lands in the job summary.
      - name: Record APK checksum
        run: |
          for apk in app/build/outputs/apk/debug/*.apk; do
            name=$(basename "$apk")
            size=$(stat -c%s "$apk")
            digest=$(sha256sum "$apk" | cut -d' ' -f1)
            echo "$name: $size bytes, sha256 $digest"
            echo "- \`$name\` — $size bytes — \`sha256:$digest\`" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: motionflow-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-reports
          path: |
            app/build/reports/**
            app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7
