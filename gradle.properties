# Gradle build JVM.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX is the only supported support-library flavour for new code.
android.useAndroidX=true

# Kotlin code style consumed by tooling and IDE formatters.
kotlin.code.style=official
